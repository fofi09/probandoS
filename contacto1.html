<!DOCTYPE html>
<html lang="es" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario de Consulta - Fondo Stripe</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Google Fonts Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
            },
            colors: {
              stripePink: '#FDD2E4',
            }
          }
        }
      }
    </script>

    <style>
      /* Full viewport striped background with user's preferred wider lines (20px) */
      .bg-vertical-stripes {
        background-color: #FFFFFF;
        background-image: repeating-linear-gradient(
          90deg,
          #FDD2E4,
          #FDD2E4 20px,
          #FFFFFF 20px,
          #FFFFFF 40px
        );
        background-size: cover;
        background-attachment: fixed;
      }

      /* Clean frosted glass card for smooth legibility over stripes */
      .glass-card {
        background: rgba(255, 255, 255, 0.85);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border: 1px solid rgba(255, 255, 255, 0.9);
      }

      /* Input focus styling */
      .glass-input {
        background-color: rgba(255, 255, 255, 0.95);
        transition: all 0.2s ease-in-out;
      }
      .glass-input:focus {
        background-color: #ffffff;
        box-shadow: 0 0 0 4px rgba(236, 72, 153, 0.25);
      }
    </style>
</head>
<body class="font-sans antialiased text-slate-800 bg-vertical-stripes min-h-screen flex items-center justify-center p-4 sm:p-6 md:p-8 selection:bg-pink-300 selection:text-pink-900">

    <!-- Centered Form Container -->
    <main class="w-full max-w-md sm:max-w-lg md:max-w-xl">
        <div class="glass-card rounded-3xl p-6 sm:p-8 md:p-10 shadow-2xl relative overflow-hidden border border-white/80">
            
            <form id="searchForm" onsubmit="handleSearch(event)" class="space-y-5 sm:space-y-6">
                
                <!-- Input: Nombre -->
                <div>
                    <label for="userName" class="block text-xs sm:text-sm font-bold text-slate-800 uppercase tracking-wider mb-2 flex items-center gap-2">
                        <i data-lucide="user" class="w-4 h-4 text-pink-600"></i> Nombre
                    </label>
                    <div class="relative">
                        <input 
                            type="text" 
                            id="userName" 
                            name="userName" 
                            required
                            placeholder="Ingresa tu nombre" 
                            class="w-full px-4 py-3.5 pl-11 rounded-2xl border border-slate-200 text-slate-900 placeholder:text-slate-400 font-medium text-sm sm:text-base glass-input focus:outline-none focus:border-pink-500 shadow-sm"
                        />
                        <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
                            <i data-lucide="user-check" class="w-5 h-5 text-pink-500"></i>
                        </div>
                    </div>
                </div>

                <!-- Input: Consulta -->
                <div>
                    <label for="userQuery" class="block text-xs sm:text-sm font-bold text-slate-800 uppercase tracking-wider mb-2 flex items-center gap-2">
                        <i data-lucide="help-circle" class="w-4 h-4 text-pink-600"></i> Consulta
                    </label>
                    <div class="relative">
                        <textarea 
                            id="userQuery" 
                            name="userQuery" 
                            rows="4" 
                            required
                            placeholder="Escribe aquí tu consulta..." 
                            class="w-full px-4 py-3.5 pl-11 rounded-2xl border border-slate-200 text-slate-900 placeholder:text-slate-400 font-medium text-sm sm:text-base glass-input focus:outline-none focus:border-pink-500 shadow-sm resize-none"
                        ></textarea>
                        <div class="absolute top-3.5 left-0 pl-3.5 pointer-events-none text-slate-400">
                            <i data-lucide="message-square-text" class="w-5 h-5 text-pink-500"></i>
                        </div>
                    </div>
                </div>

                <!-- Botón Buscar -->
                <div class="pt-2">
                    <button 
                        type="submit" 
                        id="submitBtn"
                        class="w-full py-3.5 sm:py-4 px-6 bg-gradient-to-r from-pink-500 via-rose-500 to-pink-600 hover:from-pink-600 hover:via-rose-600 hover:to-pink-700 text-white font-bold text-base sm:text-lg rounded-2xl shadow-lg hover:shadow-pink-500/30 transform active:scale-[0.98] transition-all duration-200 flex items-center justify-center gap-2 group cursor-pointer"
                    >
                        <i data-lucide="search" class="w-5 h-5 group-hover:rotate-12 transition-transform"></i>
                        <span>Buscar</span>
                    </button>
                </div>
            </form>

            <!-- Card de resultado al buscar -->
            <div id="resultsCard" class="hidden mt-6 pt-6 border-t border-slate-900/10">
                <div class="bg-white/95 rounded-2xl p-4 shadow-sm border border-pink-200">
                    <div class="flex items-center justify-between mb-2">
                        <div class="flex items-center gap-2 text-emerald-600 font-bold text-sm">
                            <i data-lucide="check-circle-2" class="w-4 h-4"></i> Búsqueda enviada
                        </div>
                        <span class="text-xs text-slate-400 font-mono" id="timestampText"></span>
                    </div>
                    <div class="text-sm text-slate-700 space-y-1">
                        <p><strong class="text-slate-900">Nombre:</strong> <span id="resName">--</span></p>
                        <p><strong class="text-slate-900">Consulta:</strong> <span id="resQuery">--</span></p>
                    </div>
                    <div class="mt-3 bg-pink-50 p-2.5 rounded-xl border border-pink-100 text-xs text-pink-900 flex items-center justify-between">
                        <span>Estado: <strong class="text-pink-700">Enviado con éxito</strong></span>
                        <button onclick="clearResults()" class="text-slate-500 hover:text-slate-800 text-xs underline">Limpiar</button>
                    </div>
                </div>
            </div>

        </div>
    </main>

    <script>
        // Initialize Lucide Icons
        lucide.createIcons();

        // Handle Form Submission
        function handleSearch(event) {
            event.preventDefault();
            
            const nameInput = document.getElementById('userName').value.trim();
            const queryInput = document.getElementById('userQuery').value.trim();
            const submitBtn = document.getElementById('submitBtn');
            const resultsCard = document.getElementById('resultsCard');

            if (!nameInput || !queryInput) return;

            const originalContent = submitBtn.innerHTML;
            submitBtn.disabled = true;
            submitBtn.innerHTML = `
                <svg class="animate-spin -ml-1 mr-2 h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                  <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                  <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                </svg>
                <span>Buscando...</span>
            `;

            setTimeout(() => {
                submitBtn.disabled = false;
                submitBtn.innerHTML = originalContent;
                lucide.createIcons();

                document.getElementById('resName').textContent = nameInput;
                document.getElementById('resQuery').textContent = queryInput;
                document.getElementById('timestampText').textContent = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                
                resultsCard.classList.remove('hidden');
            }, 500);
        }

        function clearResults() {
            document.getElementById('resultsCard').classList.add('hidden');
        }
    </script>
</body>
</html>
